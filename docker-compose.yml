services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ericargo
      POSTGRES_USER: ericargo
      POSTGRES_PASSWORD: ericargo
    ports:
      - "5432:5432"
    volumes:
      - ericargo_postgres:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ericargo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ericargo_postgres:
